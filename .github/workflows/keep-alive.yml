name: keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [PROD, DEV]
    steps:
      - name: Consulta ligera a Supabase
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.entorno)] }}
          SUPABASE_ANON_KEY: ${{ secrets[format('SUPABASE_ANON_KEY_{0}', matrix.entorno)] }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Sin secrets para ${{ matrix.entorno }}, se omite"; exit 0; fi
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/etiquetas?select=id&limit=1" > /dev/null
